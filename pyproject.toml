[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    # The CRC bit-shift loop reads more clearly as an explicit if/else than as a ternary.
    "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
# Test fakes deliberately mirror real signatures, so unused arguments are expected.
"tests/*" = ["ARG002"]
