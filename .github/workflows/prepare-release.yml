name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump to apply"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      beta:
        description: "Publish as a beta pre-release (0.2.0b1) instead of a stable release"
        type: boolean
        default: false
      dry_run:
        description: "Preview the bump and changelog without committing or publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: ${{ inputs.release_type }} ${{ inputs.beta && 'beta' || 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to start release.yml once the tag is pushed.
      actions: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the release runs from the default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "Releases must be dispatched from ${{ github.event.repository.default_branch }}," \
            "but this run is on ${{ github.ref_name }}." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run tests
        # pyproject.toml enforces the 100% statement/branch coverage gate.
        run: pytest

      - name: Prepare version bump and changelog
        id: prepare
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BETA: ${{ inputs.beta }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            --release-type "$RELEASE_TYPE"
            --repository "$REPOSITORY"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [ "$BETA" = "true" ]; then
            args+=(--beta)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/release.py "${args[@]}"

      - name: Fail if the tag already exists
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

      - name: Commit, tag and push the release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/orisec/manifest.json
          # Betas deliberately skip the changelog, and it does not exist at all
          # before the first stable release, so only stage it when present.
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git commit -m "chore(release): v$VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$TAG"

      # Drafted rather than published: release.yml builds and attaches
      # orisec.zip (the asset hacs.json installs from) and publishes the draft,
      # so nothing is installable until that workflow has a green CI run.
      - name: Draft the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          args=(--draft --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      # Creating the release with the default GITHUB_TOKEN does not fire the
      # `release` event, so release.yml has to be started explicitly. A
      # workflow_dispatch is the one event GITHUB_TOKEN can still trigger, and
      # it is dispatched from the tag so the run builds the released code.
      - name: Start the Release workflow
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          # The tag was pushed moments ago and can take a little while to become
          # dispatchable, so give it a few attempts before failing the release.
          for _ in 1 2 3 4 5; do
            if gh workflow run release.yml --ref "$TAG"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not start the Release workflow for $TAG." >&2
          exit 1

      - name: Summarise the release
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          PREVIOUS_VERSION: ${{ steps.prepare.outputs.previous_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run: $PREVIOUS_VERSION would become $TAG"
            else
              echo "## Drafted $TAG (was $PREVIOUS_VERSION)"
              echo
              echo "The [Release workflow]($REPOSITORY_URL/actions/workflows/release.yml)" \
                "publishes it once CI is green."
            fi
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
