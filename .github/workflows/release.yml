name: Release

on:
  release:
    types: [published]
  # Prepare Release starts this workflow for the tag it just pushed. A release
  # created with the default GITHUB_TOKEN does not fire the `release` event, but
  # a workflow_dispatch is the documented exception that does start a new run.
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the tag rather than the workflow so two releases cut back to back do
# not publish over each other.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve the tag being released
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          # The run builds and tests the code it checks out, so a dispatched run
          # has to come from the tag itself rather than from a branch.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "${GITHUB_REF#refs/tags/}" ]; then
            echo "Release must be run from a tag, but this run is on $GITHUB_REF." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The release asset is what HACS installs (hacs.json sets zip_release), so
  # gating the upload on a green CI run means a release with failing tests is
  # never installable.
  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    needs: [tag, ci]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Sync manifest version with the release tag
        run: |
          version="${TAG#v}"
          echo "Releasing version ${version}"
          jq --arg version "$version" '.version = $version' \
            custom_components/orisec/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/orisec/manifest.json
          cat custom_components/orisec/manifest.json

      - name: Build the integration archive
        run: |
          cd custom_components/orisec
          zip -r orisec.zip . -x '*.pyc' -x '__pycache__/*'

      - name: Attach the archive to the release
        run: |
          gh release upload "$TAG" \
            custom_components/orisec/orisec.zip --clobber

      - name: Publish the release
        # Prepare Release leaves the release as a draft, so this is the step
        # that makes it installable. Publishing an already published release is
        # a no-op, which is what a hand-published release hits.
        run: gh release edit "$TAG" --draft=false

      - name: Summarise the release
        run: |
          {
            echo "## Published $TAG"
            echo
            echo "\`orisec.zip\` attached to $(gh release view "$TAG" --json url --jq .url)."
          } >> "$GITHUB_STEP_SUMMARY"
